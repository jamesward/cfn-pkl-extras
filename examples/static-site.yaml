                - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths '/*'
        GitSubmodulesConfig:
          FetchSubmodules: true
        Location: https://github.com/jamesward-test/hello-hugo.git
        Type: GITHUB
      SourceVersion: refs/heads/main
      Triggers:
        FilterGroups:
