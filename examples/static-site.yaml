AWSTemplateFormatVersion: 2010-09-09
Resources:
  ConnectionLookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - codeconnections:GetSyncConfiguration
            - codeconnections:GetRepositoryLink
            - codestar-connections:GetSyncConfiguration
            - codestar-connections:GetRepositoryLink
            Resource:
            - '*'
        PolicyName: ConnectionLookup
  ConnectionLookupFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: cfn_extras.connection_lookup.handler
      Timeout: 60
      Role:
        Fn::GetAtt:
        - ConnectionLookupRole
        - Arn
      Code:
        S3Bucket: cfn-extras-resource
        S3Key: cfn-extras-resource.zip
        S3ObjectVersion: gpucdYhAHtURnEC1jLVSotYBtr5h6A56
        S3ObjectStorageMode: REFERENCE
  ConnectionLookup:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceTimeout: 120
      ServiceToken:
        Fn::GetAtt:
        - ConnectionLookupFunction
        - Arn
      StackName:
        Ref: AWS::StackName
  asdftestBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  asdftestOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: asdftest-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  asdftestIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |-
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/old' || uri === '/legacy') {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: '/' } } };
          }
          if (uri === '/gh') {
            return { statusCode: 302, statusDescription: 'Found', headers: { location: { value: 'https://github.com/jamesward-test/asdf' } } };
          }
          if (uri.startsWith('/docs/')) {
            var rest = uri.substring(6);
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: '/' + rest + '' } } };
          }
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }
      FunctionConfig:
        Comment: Directory index rewrite
        Runtime: cloudfront-js-1.0
      Name: asdftestIndex
  asdftestDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultCacheBehavior:
          AllowedMethods:
          - GET
          - HEAD
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - asdftestIndexFunction
              - FunctionMetadata.FunctionARN
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        Origins:
        - DomainName:
            Fn::GetAtt:
            - asdftestBucket
            - RegionalDomainName
          Id: s3-origin
          OriginAccessControlId:
            Ref: asdftestOriginAccessControl
          S3OriginConfig:
            OriginAccessIdentity: ''
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  asdftestBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: asdftestBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${asdftestBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${asdftestDistribution}
  asdftestBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          Effect: Allow
          Principal:
            Service: codebuild.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
            Resource:
            - Fn::Sub: ${asdftestBucket.Arn}
            - Fn::Sub: ${asdftestBucket.Arn}/*
          - Effect: Allow
            Action:
            - cloudfront:CreateInvalidation
            Resource:
              Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${asdftestDistribution}
          - Effect: Allow
            Action:
            - codeconnections:GetConnectionToken
            - codeconnections:GetConnection
            - codeconnections:UseConnection
            Resource:
              Fn::GetAtt:
              - ConnectionLookup
              - ConnectionArn
        PolicyName: Deploy
  asdftestBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
        - Name: BUCKET
          Value:
            Ref: asdftestBucket
        - Name: DISTRIBUTION_ID
          Value:
            Ref: asdftestDistribution
        - Name: SITE_URL
          Value:
            Fn::GetAtt:
            - asdftestDistribution
            - DomainName
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        Type: LINUX_CONTAINER
      ServiceRole:
        Fn::GetAtt:
        - asdftestBuildRole
        - Arn
      Source:
        Auth:
          Resource:
            Fn::GetAtt:
            - ConnectionLookup
            - ConnectionArn
          Type: CODECONNECTIONS
        BuildSpec: |-
          version: 0.2
          phases:
            post_build:
              commands:
                - EXCLUDES="--exclude '.git/*' --exclude '.slugignore'"; if [ -f .slugignore ]; then while IFS= read -r p; do case "$p" in ''|'#'*) ;; *) EXCLUDES="$EXCLUDES --exclude '$p'";; esac; done < .slugignore; fi; eval aws s3 sync ./ "s3://${BUCKET}/" --delete $EXCLUDES
                - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths '/*'
        Location: https://github.com/jamesward-test/asdf.git
        Type: GITHUB
      SourceVersion: refs/heads/main
      Triggers:
        FilterGroups:
        - - Type: EVENT
            Pattern: PUSH
          - Type: HEAD_REF
            Pattern: ^refs/heads/main$
        Webhook: true
  asdftestTriggerBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - codebuild:StartBuild
            - codebuild:BatchGetBuilds
            Resource:
            - Fn::GetAtt:
              - asdftestBuildProject
              - Arn
        PolicyName: asdftestTriggerBuild
  asdftestTriggerBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
      Handler: cfn_extras.trigger_build.handler
      Timeout: 900
      Role:
        Fn::GetAtt:
        - asdftestTriggerBuildRole
        - Arn
      Code:
        S3Bucket: cfn-extras-resource
        S3Key: cfn-extras-resource.zip
        S3ObjectVersion: gpucdYhAHtURnEC1jLVSotYBtr5h6A56
        S3ObjectStorageMode: REFERENCE
  asdftestTriggerBuild:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceTimeout: 960
      ServiceToken:
        Fn::GetAtt:
        - asdftestTriggerBuildFunction
        - Arn
      ProjectName:
        Ref: asdftestBuildProject
  hellohugotestBucket:
    Type: AWS::S3::Bucket
