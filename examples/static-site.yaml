            request.uri += '/index.html';
          }
          return request;
        }
      FunctionConfig:
        Comment: Directory index rewrite
        Runtime: cloudfront-js-1.0
      Name: hellohugotestIndex
  hellohugotestDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultCacheBehavior:
          AllowedMethods:
