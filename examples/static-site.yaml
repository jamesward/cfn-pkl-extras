AWSTemplateFormatVersion: 2010-09-09
Resources:
  SdkCallRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - codeconnections:GetSyncConfiguration
            Resource:
            - '*'
          - Effect: Allow
            Action:
            - codeconnections:GetRepositoryLink
            Resource:
            - Fn::Sub: arn:aws:codeconnections:${AWS::Region}:${AWS::AccountId}:repository-link/*
        PolicyName: SdkCall
  SdkCallFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import cfnresponse


          # Flatten a nested response into dot-notation keys, e.g.
          # {"A": {"B": "x"}} -> {"A.B": "x"}. CloudFormation custom-resource Fn::GetAtt
          # does a flat key lookup (it can't traverse nested JSON), so the dot key becomes
          # the attribute name: Fn::GetAtt [Resource, "A.B"].
          def flatten(obj, prefix, out):
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      flatten(v, prefix + k + ".", out)
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      flatten(v, prefix + str(i) + ".", out)
              else:
                  out[prefix[:-1]] = obj if isinstance(obj, str) else str(obj)


          def dig(obj, path):
              for part in path.split("."):
                  obj = obj[int(part)] if isinstance(obj, list) else obj[part]
              return obj


          def handler(event, context):
              try:
                  if event["RequestType"] == "Delete":
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {},
                                       physicalResourceId=event.get("PhysicalResourceId"))
                      return
                  props = event["ResourceProperties"]
                  client = boto3.client(props["Service"])
                  response = getattr(client, props["Action"])(**props.get("Parameters", {}))
                  response.pop("ResponseMetadata", None)
                  data = {}
                  flatten(response, "", data)
                  id_path = props.get("PhysicalResourceIdPath")
                  physical_id = dig(response, id_path) if id_path \
                      else event.get("PhysicalResourceId") or event["LogicalResourceId"]
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data,
                                   physicalResourceId=str(physical_id))
              except Exception as e:
                  print("Error:", e)
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)})
      Handler: index.handler
      Role:
        Fn::GetAtt:
        - SdkCallRole
        - Arn
      Runtime: python3.13
      Timeout: 60
  ConnectionSyncConfig:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceTimeout: 120
      ServiceToken:
        Fn::GetAtt:
        - SdkCallFunction
        - Arn
      Service: codeconnections
      Action: get_sync_configuration
      Parameters:
        SyncType: CFN_STACK_SYNC
        ResourceName:
          Ref: AWS::StackName
  ConnectionLink:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceTimeout: 120
      ServiceToken:
        Fn::GetAtt:
        - SdkCallFunction
        - Arn
      Service: codeconnections
      Action: get_repository_link
      Parameters:
        RepositoryLinkId:
          Fn::GetAtt:
          - ConnectionSyncConfig
          - SyncConfiguration.RepositoryLinkId
      PhysicalResourceIdPath: RepositoryLinkInfo.ConnectionArn
  asdftestBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  asdftestOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: asdftest-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  asdftestIndexFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionCode: |-
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/old' || uri === '/legacy') {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: '/' } } };
          }
          if (uri === '/gh') {
            return { statusCode: 302, statusDescription: 'Found', headers: { location: { value: 'https://github.com/jamesward-test/asdf' } } };
          }
          if (uri.startsWith('/docs/')) {
            var rest = uri.substring(6);
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: '/' + rest + '' } } };
          }
          if (uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!uri.includes('.')) {
            request.uri += '/index.html';
          }
          return request;
        }
      FunctionConfig:
        Comment: Directory index rewrite
        Runtime: cloudfront-js-1.0
      Name: asdftestIndex
  asdftestDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        DefaultCacheBehavior:
          AllowedMethods:
          - GET
          - HEAD
          CachedMethods:
          - GET
          - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
          FunctionAssociations:
          - EventType: viewer-request
            FunctionARN:
              Fn::GetAtt:
              - asdftestIndexFunction
              - FunctionMetadata.FunctionARN
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2
        Origins:
        - DomainName:
            Fn::GetAtt:
            - asdftestBucket
            - RegionalDomainName
          Id: s3-origin
          OriginAccessControlId:
            Ref: asdftestOriginAccessControl
          S3OriginConfig:
            OriginAccessIdentity: ''
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  asdftestBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: asdftestBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service: cloudfront.amazonaws.com
          Action: s3:GetObject
          Resource:
            Fn::Sub: ${asdftestBucket.Arn}/*
          Condition:
            StringEquals:
              AWS:SourceArn:
                Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${asdftestDistribution}
  asdftestBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          Effect: Allow
          Principal:
            Service: codebuild.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*
          - Effect: Allow
            Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
            Resource:
            - Fn::Sub: ${asdftestBucket.Arn}
            - Fn::Sub: ${asdftestBucket.Arn}/*
          - Effect: Allow
            Action:
            - cloudfront:CreateInvalidation
            Resource:
              Fn::Sub: arn:aws:cloudfront::${AWS::AccountId}:distribution/${asdftestDistribution}
          - Effect: Allow
            Action:
            - codeconnections:GetConnectionToken
            - codeconnections:GetConnection
            - codeconnections:UseConnection
            Resource:
              Fn::GetAtt:
              - ConnectionLink
              - RepositoryLinkInfo.ConnectionArn
        PolicyName: Deploy
  asdftestBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        EnvironmentVariables:
        - Name: BUCKET
          Value:
            Ref: asdftestBucket
        - Name: DISTRIBUTION_ID
          Value:
            Ref: asdftestDistribution
        - Name: SITE_URL
          Value:
            Fn::GetAtt:
            - asdftestDistribution
            - DomainName
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        Type: LINUX_CONTAINER
      ServiceRole:
        Fn::GetAtt:
        - asdftestBuildRole
        - Arn
      Source:
        Auth:
          Resource:
            Fn::GetAtt:
            - ConnectionLink
            - RepositoryLinkInfo.ConnectionArn
          Type: CODECONNECTIONS
        BuildSpec: |-
          version: 0.2
          phases:
            post_build:
              commands:
                - EXCLUDES="--exclude '.git/*' --exclude '.slugignore'"; if [ -f .slugignore ]; then while IFS= read -r p; do case "$p" in ''|'#'*) ;; *) EXCLUDES="$EXCLUDES --exclude '$p'";; esac; done < .slugignore; fi; eval aws s3 sync ./ "s3://${BUCKET}/" --delete $EXCLUDES
                - aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" --paths '/*'
        Location: https://github.com/jamesward-test/asdf.git
        Type: GITHUB
      SourceVersion: refs/heads/main
      Triggers:
        FilterGroups:
        - - Type: EVENT
            Pattern: PUSH
          - Type: HEAD_REF
            Pattern: ^refs/heads/main$
        Webhook: true
  asdftestTriggerBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - codebuild:StartBuild
            - codebuild:BatchGetBuilds
            Resource:
            - Fn::GetAtt:
              - asdftestBuildProject
              - Arn
        PolicyName: asdftestTriggerBuild
  asdftestTriggerBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import time

          def handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      codebuild = boto3.client('codebuild')

                      build = codebuild.start_build(
                          projectName=event['ResourceProperties']['ProjectName']
                      )

                      build_id = build['build']['id']

                      # Poll until complete or timeout
                      while True:
                          # Check remaining lambda execution time
                          if context.get_remaining_time_in_millis() < 10000:  # 10 seconds buffer
                              raise Exception("Lambda timeout approaching before build completion")

                          response = codebuild.batch_get_builds(ids=[build_id])
                          if not response['builds']:
                              raise Exception(f"Build {build_id} not found")

                          build_status = response['builds'][0]['buildStatus']

                          if build_status == 'SUCCEEDED':
                              response_data = {
                                  'BuildId': build_id,
                                  'Status': build_status
                              }
                              cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
                              return

                          elif build_status in ['FAILED', 'FAULT', 'STOPPED', 'TIMED_OUT']:
                              # Get the build logs URL and failure details
                              logs = response['builds'][0].get('logs', {})
                              log_url = logs.get('deepLink', 'No logs URL available')
                              phase_details = next((phase for phase in response['builds'][0].get('phases', [])
                                                    if phase.get('phaseStatus') == 'FAILED'), {})

                              error_message = (
                                  f"Build failed with status: {build_status}. "
                                  f"Phase: {phase_details.get('phaseType', 'Unknown')}. "
                                  f"Error: {phase_details.get('statusMessage', 'No error message available')}. "
                                  f"Logs: {log_url}"
                              )

                              response_data = {
                                  'BuildId': build_id,
                                  'Status': build_status,
                                  'Error': error_message
                              }
                              cfnresponse.send(event, context, cfnresponse.FAILED, response_data)
                              return

                          # Still in progress, wait before next check
                          time.sleep(10)

                  elif event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {
                      'Error': str(e)
                  })
      Handler: index.handler
      Role:
        Fn::GetAtt:
        - asdftestTriggerBuildRole
        - Arn
      Runtime: python3.9
      Timeout: 900
  asdftestTriggerBuild:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceTimeout: 960
      ServiceToken:
        Fn::GetAtt:
        - asdftestTriggerBuildFunction
        - Arn
      ProjectName:
        Ref: asdftestBuildProject
