      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Effect: Allow
            Action:
            - codebuild:StartBuild
            - codebuild:BatchGetBuilds
            Resource:
            - Fn::GetAtt:
              - hellohugotestBuildProject
              - Arn
        PolicyName: hellohugotestTriggerBuild
  hellohugotestTriggerBuildFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.13
